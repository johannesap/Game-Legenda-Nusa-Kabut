<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legenda Nusa Kabut</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&family=Alegreya+Sans:wght@400;500;700&family=Oswald:wght@400;500&display=swap">
<style>
/* Layout: full-screen 3D world, HUD strip on top, menu rail at the bottom, sheets slide over the world. */
:root{
  --bg:#e9ece2; --panel:#f7f8f2; --ink:#1f2a29; --muted:#5d6b66; --line:#c9d0c2;
  --accent:#2f7d6d; --gold:#a8771f; --hp:#b33a3a; --mp:#3a62b3; --ok:#2e7d3c;
  --shade:rgba(20,28,26,.45);
  --display:"Almendra",Georgia,"Times New Roman",serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --scale:1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141c; --panel:#1a2030; --ink:#e7e3d4; --muted:#9aa3b2; --line:#2e3648;
  --accent:#e0a84a; --gold:#e7c063; --hp:#e06464; --mp:#6f97ea; --ok:#6cc47c; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141c; --panel:#1a2030; --ink:#e7e3d4; --muted:#9aa3b2; --line:#2e3648;
  --accent:#e0a84a; --gold:#e7c063; --hp:#e06464; --mp:#6f97ea; --ok:#6cc47c; --shade:rgba(0,0,0,.6); color-scheme:dark}
/* the game's own theme setting (auto by local time / light / dark) overrides the viewer default */
body[data-ui="light"]{--accent:#2f7d6d;--bg:#e9ece2;--panel:#f7f8f2;--ink:#1f2a29;--muted:#5d6b66;--line:#c9d0c2;--gold:#a8771f;--hp:#b33a3a;--mp:#3a62b3;--ok:#2e7d3c;--shade:rgba(20,28,26,.45);color-scheme:light}
body[data-ui="dark"]{--accent:#e0a84a;--bg:#10141c;--panel:#1a2030;--ink:#e7e3d4;--muted:#9aa3b2;--line:#2e3648;--gold:#e7c063;--hp:#e06464;--mp:#6f97ea;--ok:#6cc47c;--shade:rgba(0,0,0,.6);color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:calc(15px*var(--scale));overflow:hidden;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:.45em .8em}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:700}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;padding-top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
#hud>*{pointer-events:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 10px var(--shade)}
#who{display:flex;gap:10px;align-items:center;padding:8px 12px;min-width:0;flex:1 1 260px;max-width:420px}
#avatar{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;font-size:1.1em}
#who .meta{flex:1;min-width:0}
#who .name{font-family:var(--display);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:.85em}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;transition:width .3s}
.bar.hp i{background:var(--hp)} .bar.mp i{background:var(--mp)} .bar.xp i{background:var(--gold)}
#quest{padding:8px 12px;font-size:.88em;flex:0 1 230px;min-width:0}
#quest b{font-family:var(--display)}
/* minimap: round, turns with the camera; tap opens the full map */
#minimap{margin-left:auto;flex:none;width:132px;height:132px;padding:0;border-radius:50%;overflow:hidden}
#minimap canvas{display:block;width:100%;height:100%}
.worldmap{display:block;width:100%;max-width:min(100%,68vh);aspect-ratio:1;margin:0 auto 8px;border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:crosshair}
.maptools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.maptools button{min-width:40px;font-weight:700}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:.8em;white-space:nowrap}
.chip.ok{border-color:var(--ok);color:var(--ok)} .chip.warn{border-color:var(--gold);color:var(--gold)}
/* menu rail */
#menu{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;justify-content:center;flex-wrap:wrap;pointer-events:none}
#menu button{pointer-events:auto;box-shadow:0 2px 8px var(--shade);font-size:.9em;position:relative}
#menu .dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--hp);color:#fff;font-size:11px;line-height:16px;padding:0 4px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));font-size:.82em;color:var(--ink);background:var(--panel);padding:3px 10px;border-radius:99px;border:1px solid var(--line);opacity:.9;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
/* sheets */
.overlay{position:fixed;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px));z-index:10}
.sheet{width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet header h2{flex:1;font-size:1.35em}
.sheet .body{padding:14px 16px;overflow:auto;min-height:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.slot b{font-family:var(--display)}
.slot.equipped{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>label{flex:1 1 140px;min-width:0}
label{display:flex;flex-direction:column;gap:3px;font-size:.88em;color:var(--muted)}
input[type=text],input[type=time],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.4em .55em;width:100%;box-sizing:border-box}
input[type=color]{width:100%;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:2px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right}
.tablebox{overflow-x:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.tile{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.tile .v{font-size:1.4em;font-weight:700;font-variant-numeric:tabular-nums}
.ach{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:6px}
.ach.locked{opacity:.5}
.ach .seal{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;border:2px solid var(--gold);color:var(--gold)}
.hbar{display:flex;align-items:center;gap:8px;margin:4px 0}
.hbar span:first-child{width:110px;flex:none;font-size:.88em}
.hbar i{height:12px;background:var(--accent);border-radius:3px;display:block}
.chatlog{height:300px;max-height:45vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.msg{min-width:0;overflow-wrap:anywhere}.msg b{color:var(--accent)}
/* creation */
#create .sheet{width:min(980px,100%)}
#create .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
#create .preview{border:1px solid var(--line);border-radius:8px;min-height:260px;position:relative;background:linear-gradient(var(--bg),var(--panel))}
#create canvas{position:absolute;inset:0;width:100%;height:100%}
.pvturn{position:absolute;bottom:10px;width:44px;height:44px;border-radius:50%;padding:0;font-size:1.3em;font-weight:700;box-shadow:0 2px 8px var(--shade);z-index:1}
#pvLeft{left:10px}#pvRight{right:10px}
.classes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.classes button{display:flex;flex-direction:column;gap:2px;text-align:left;padding:8px}
.classes button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.classes small{color:var(--muted);font-size:.78em}
/* battle: panel docks to the bottom so the 3D fight stays visible above it */
#battle{background:none;align-items:flex-end;pointer-events:none}
#battle .sheet{width:min(640px,100%);pointer-events:auto;max-height:52%}
#battle .sheet header{padding:8px 14px}
#battle .sheet .body{padding:10px 14px}
#battle .blog{height:72px}
.skillbar{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));width:min(190px,38vw);display:flex;flex-direction:column;gap:6px;overflow-y:auto;z-index:12;padding:2px}
.skillhead{font-family:var(--display);font-weight:700;color:#fff;text-shadow:0 1px 3px #000;padding-left:2px}
.skillbar button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:.4em .6em;border-left:5px solid var(--sk);box-shadow:0 2px 8px var(--shade);background:var(--panel)}
.skillbar button:not(:disabled):hover{transform:translateX(-3px)}
.skillbar button b{font-size:.9em;line-height:1.15}
.skillbar button small{color:var(--muted);font-size:.74em}
@media (max-width:640px){.skillbar button{padding:.3em .45em}.skillbar button b{font-size:.8em}}
/* character screen: dark translucent game panels over the paused world */
:root{--cs-panel:rgba(22,24,26,.88);--cs-head:rgba(50,52,54,.92);--cs-cell:rgba(0,0,0,.4);--cs-line:rgba(255,255,255,.11);--cs-ink:#ebe6da;--cs-muted:#aca695;--cs-hi:#f0c860;--cs-font:"Oswald","Arial Narrow",sans-serif}
#charScreen{position:fixed;inset:0;z-index:11;background:linear-gradient(rgba(8,10,12,.5),rgba(8,10,12,.72));color:var(--cs-ink);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(10px + env(safe-area-inset-bottom,0px))}
.cs-top{display:flex;align-items:center;gap:4px;margin:0 auto 10px;background:var(--cs-head);border:1px solid var(--cs-line);border-radius:10px;padding:4px 6px;max-width:100%}
.cs-top h2{font-family:var(--cs-font);font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:1.5em;padding:0 18px;color:var(--cs-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#csTabs{display:flex;gap:2px}
.cs-tab,#csClose{background:none;border:0;color:var(--cs-muted);padding:6px 9px;border-radius:7px}
.cs-tab[aria-pressed="true"]{color:var(--cs-ink);background:rgba(255,255,255,.12)}
.cs-tab:hover,#csClose:hover{color:var(--cs-ink)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#csBody{flex:1;overflow:auto;min-height:0}
.cs-cols{display:grid;grid-template-columns:minmax(300px,1fr) minmax(360px,1.35fr) minmax(260px,.95fr);gap:14px;max-width:1480px;margin:0 auto;align-items:start}
.cs-cols.two{grid-template-columns:1fr 1.2fr}
.cs-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.cs-panel{background:var(--cs-panel);border:1px solid var(--cs-line);border-radius:4px;min-width:0;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.cs-panel>header{display:flex;align-items:center;gap:8px;background:var(--cs-head);padding:7px 10px;border-bottom:2px solid rgba(255,255,255,.08)}
.cs-panel>header h3{font-family:var(--cs-font);font-weight:500;text-transform:uppercase;letter-spacing:.04em;font-size:1.25em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-extra{font-family:var(--cs-font);color:var(--cs-muted);text-transform:uppercase;font-size:.95em;white-space:nowrap}
.cs-job{display:flex;align-items:center;gap:6px;padding:8px 12px 0;color:var(--cs-hi);font-family:var(--cs-font);letter-spacing:.03em}
.cs-herobody{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;padding:8px 10px;align-items:stretch}
.cs-res{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;justify-content:center}
.cs-res li{display:flex;align-items:center;gap:6px;font-family:var(--cs-font);font-size:1.15em}
.cs-model{width:100%;height:clamp(260px,46vh,440px);display:block}
.cs-gear{display:flex;flex-direction:column;gap:10px;justify-content:center}
.cs-slot{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75em;color:var(--cs-muted);text-transform:uppercase;font-family:var(--cs-font)}
.cs-slot .cs-cell{width:74px}
.cs-wide{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--cs-head);border:0;border-top:1px solid var(--cs-line);border-radius:0 0 4px 4px;color:var(--cs-ink);padding:10px;font-family:var(--cs-font);text-transform:uppercase;letter-spacing:.05em;font-size:1.05em}
.cs-cell{position:relative;aspect-ratio:1;background:var(--cs-cell);border:1px solid var(--cs-line);border-radius:2px;padding:0;display:grid;place-items:center;overflow:hidden;color:var(--cs-ink);min-width:0}
.cs-cell img{width:82%;height:82%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.cs-cell.on{outline:2px solid var(--cs-hi);outline-offset:-2px}
.cs-cell.empty{cursor:default}
.cs-n{position:absolute;right:4px;bottom:6px;font-family:var(--cs-font);font-size:.9em;text-shadow:0 1px 2px #000}
.cs-e{position:absolute;left:5px;top:3px;font-family:var(--cs-font);font-size:.72em;color:var(--cs-hi)}
.cs-q{position:absolute;left:0;right:0;bottom:0;height:4px}
.cs-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;padding:8px}
.cs-detail{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 14px;padding:10px}
.cs-big{position:relative;aspect-ratio:1;background:var(--cs-cell);border:1px solid var(--cs-line);display:grid;place-items:center}
.cs-big img{width:86%}
.cs-lines{grid-row:span 2;font-family:var(--cs-font);line-height:1.5;color:var(--cs-muted);min-width:0}
.cs-lines b{color:var(--cs-hi);font-weight:500}
.cs-panel .up{color:#7ad06a}.cs-panel .down{color:#e8806e}
.cs-acts{display:flex;flex-direction:column;gap:6px}
.cs-acts button{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid var(--cs-line);color:var(--cs-ink);font-family:var(--cs-font);text-transform:uppercase;letter-spacing:.04em;border-radius:3px;font-weight:400}
.cs-acts button.primary{background:rgba(240,200,96,.18);border-color:rgba(240,200,96,.5)}
.cs-acts button:disabled{opacity:.45}
.cs-desc{margin:0;padding:0 12px 12px;color:var(--cs-muted);font-size:.92em}
.cs-empty{color:var(--cs-muted);padding:8px 12px;margin:0;font-size:.9em}
.cs-list{list-style:none;margin:0;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cs-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;font-family:var(--cs-font);text-transform:uppercase;letter-spacing:.02em;color:var(--cs-muted)}
.cs-list li b{color:var(--cs-ink);font-weight:500}
.cs-bar{width:90px;height:7px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.cs-bar i{display:block;height:100%}
.cs-plus{width:30px;height:30px;padding:0;background:rgba(255,255,255,.08);border:1px solid var(--cs-line);color:var(--cs-ink);border-radius:3px;font-weight:700}
.cs-plus:disabled{opacity:.35}
.cs-skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;padding:10px}
.cs-skill{border-left:4px solid var(--sk);background:var(--cs-cell);padding:6px 9px;display:flex;flex-direction:column;gap:2px;font-size:.85em;color:var(--cs-muted)}
.cs-skill b{font-family:var(--cs-font);font-weight:500;color:var(--cs-ink);font-size:1.12em}
.cs-skill.locked{opacity:.45}
.cs-tier{font-family:var(--cs-font);font-weight:500;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px 0;margin:0;color:var(--cs-hi)}
.cs-evos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;padding:6px 12px}
.cs-evo{background:var(--cs-cell);border:1px solid var(--cs-line);padding:8px;display:flex;flex-direction:column;gap:3px;font-size:.84em;color:var(--cs-muted)}
.cs-evo b{font-family:var(--cs-font);font-weight:500;color:var(--cs-ink);font-size:1.15em}
.cs-evo.mine{border-color:var(--cs-hi)}
.cs-evo.locked{opacity:.55}
.cs-evo button{margin-top:4px}
@media (max-width:1100px){.cs-cols{grid-template-columns:1fr 1fr}.cs-cols>.cs-col:last-child{grid-column:1/-1}}
@media (max-width:720px){#charScreen{padding-inline:8px}.cs-cols,.cs-cols.two{grid-template-columns:1fr}.cs-grid{grid-template-columns:repeat(6,minmax(0,1fr))}.cs-model{height:230px}.cs-detail{grid-template-columns:96px minmax(0,1fr)}.cs-top h2{font-size:1.15em;padding:0 8px}.cs-slot .cs-cell{width:60px}.cs-res li{font-size:1em}}
/* real-time combat: hotbar above the menu, HP bars over monsters */
#hotbar{position:fixed;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:5;max-width:calc(100% - 140px);overflow-x:auto;padding:3px;background:rgba(16,18,20,.55);border:1px solid rgba(255,255,255,.12);border-radius:8px;scrollbar-width:none}
#hotbar .hb{position:relative;flex:none;width:68px;height:58px;padding:3px 4px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:0;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.14);border-bottom:3px solid var(--sk,#888);border-radius:4px;color:#ece7da;overflow:hidden;text-align:left}
#hotbar .hb b{font-family:"Oswald","Arial Narrow",sans-serif;font-weight:500;font-size:.72em;line-height:1.1;max-height:2.2em;overflow:hidden}
#hotbar .hb small{font-size:.62em;color:#b8b2a2}
#hotbar kbd{position:absolute;top:2px;left:4px;font:600 .66em "Oswald",sans-serif;color:#f0c860}
#hotbar .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.62);pointer-events:none}
#hotbar .hb.nomp{opacity:.5}
body.inbattle #hotbar,body.inbattle #foebars{display:none}
#foebars{position:fixed;inset:0;pointer-events:none;z-index:4}
.foebar{position:absolute;left:0;top:0;width:120px;margin:-30px 0 0 -60px;text-align:center;font:500 .72em "Oswald","Arial Narrow",sans-serif;color:#fff;text-shadow:0 1px 2px #000}
.foebar>div{height:6px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.35);border-radius:3px;overflow:hidden;margin-top:1px}
.foebar i{display:block;height:100%;background:#d8443a}
.foebar.on span{color:#ffd27a}.foebar.boss i{background:#b04ad8}
.fxnum.hurt{color:#ff7a6a}
@media (max-width:640px){#hotbar{max-width:calc(100% - 90px)}#hotbar .hb{width:56px;height:50px}}
#battle .camhint{margin:6px 0 0;font-size:.78em}
body.inbattle #hud,body.inbattle #hint,body.inbattle #jumpBtn,body.inbattle #menu,body.inbattle #tags{visibility:hidden}
.foes .side{display:flex;flex-direction:column;gap:6px;min-width:0}
.fighter.current h3{color:var(--accent)}
.fighter.down{opacity:.45}
/* multiplayer: name tags, chat bubbles, invitations */
#tags{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;font-size:.8em;font-weight:700;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap}
.tag.busy .nm::after{content:" ⚔"}
.tag .bub{max-width:220px;white-space:normal;background:var(--panel);color:var(--ink);text-shadow:none;font-weight:400;padding:4px 8px;border-radius:8px;border:1px solid var(--line);margin-bottom:3px;overflow-wrap:anywhere;text-align:center}
#invite{position:fixed;left:50%;transform:translateX(-50%);top:calc(84px + env(safe-area-inset-top,0px));z-index:12;padding:10px 14px;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100% - 32px));box-sizing:border-box}
.plist{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.plist .slot{flex-direction:row;align-items:center;gap:10px}
.plist .slot>div{flex:1;min-width:0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:11;overflow:hidden}
.fxbanner{position:absolute;left:50%;top:9%;transform:translateX(-50%);font-family:var(--display);font-weight:700;font-size:2.1em;color:#fff;letter-spacing:.04em;white-space:nowrap;text-shadow:0 0 10px var(--c),0 0 26px var(--c),0 2px 0 #000;animation:banner 1.3s ease-out forwards}
@keyframes banner{0%{opacity:0;transform:translate(-50%,10px) scale(.85)}15%{opacity:1;transform:translate(-50%,0) scale(1.08)}28%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-12px)}}
.fxflash{position:absolute;inset:0;background:var(--c);opacity:0;animation:flash .3s ease-out}
@keyframes flash{from{opacity:var(--a)}to{opacity:0}}
.fxnum{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-weight:700;font-size:1.7em;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;white-space:nowrap;animation:rise 1.1s ease-out forwards}
.fxnum.crit{font-size:2.4em;color:#ffd24a}
.fxnum.heal{color:#7dff8a}.fxnum.mp{color:#8fb8ff}.fxnum.poison{color:#b6f06a}.fxnum.miss{color:#ddd;font-size:1.25em}
@keyframes rise{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-70px}}
#actBtn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));z-index:5;padding:.55em 1em;border-radius:99px;box-shadow:0 2px 10px var(--shade);font-weight:700}
body.inbattle #actBtn,body.inbattle #atkBtn{visibility:hidden}
#atkBtn{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 68px);width:68px;height:68px;border-radius:50%;padding:0;z-index:5;overflow:hidden;background:#b8432f;border:2px solid #f08a66;color:#fff;font-weight:700;font-size:.84em;box-shadow:0 2px 10px var(--shade)}
#atkBtn b{position:relative;z-index:1}
#atkBtn kbd{position:absolute;top:7px;left:0;right:0;text-align:center;font:600 .72em "Oswald",sans-serif;color:#ffd27a;z-index:1}
#atkBtn .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.45)}
#atkBtn:active{transform:scale(.94)}
#jumpBtn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;font-weight:700;font-size:.82em;box-shadow:0 2px 10px var(--shade);padding:0;z-index:5}
.foes{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:10px}
.fighter{min-width:0}.fighter h3{font-size:1.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs{font-family:var(--display);font-size:1.4em;color:var(--gold)}
.blog{height:130px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:.9em;margin-bottom:10px;background:var(--bg)}
.blog p{margin:2px 0}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.acts button small{display:block;color:var(--muted);font-size:.78em}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* toasts */
#toasts{position:fixed;top:calc(150px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;z-index:20;max-width:min(320px,calc(100% - 32px))}
.toast{padding:8px 12px;border-left:4px solid var(--accent);animation:in .25s}
@keyframes in{from{transform:translateY(-6px);opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){
  #create .split{grid-template-columns:1fr}
  #create .preview{min-height:200px}
  #quest{display:none}
  #minimap{width:96px;height:96px}
  #who{flex-basis:0} /* share the top row with the minimap */
  #menu button{padding:.4em .55em;font-size:.82em}
  .classes{grid-template-columns:1fr}
}
/* a wall of light stops the hero: warning in the middle; the dungeon's floor and monster count at the top */
#lockwarn{position:fixed;left:50%;top:32%;transform:translateX(-50%);z-index:21;max-width:min(440px,calc(100% - 32px));padding:12px 18px;border-radius:10px;background:rgba(20,10,14,.88);border:2px solid #ff6a5a;color:#ffe6e0;font-weight:700;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.5);pointer-events:none}
#dhud{position:fixed;left:50%;top:calc(118px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:6;padding:6px 14px;border-radius:99px;background:rgba(30,14,48,.85);border:1px solid #b06cff;color:#f0e6ff;font:500 .9em "Oswald","Arial Narrow",sans-serif;letter-spacing:.03em;white-space:nowrap;pointer-events:none}
@media (max-height:520px){#dhud{top:calc(96px + env(safe-area-inset-top,0px));font-size:.78em}}
/* touch screens: analog stick bottom-left */
#stick{position:fixed;left:max(18px,env(safe-area-inset-left,0px));width:120px;height:120px;border-radius:50%;background:rgba(16,18,22,.32);border:2px solid rgba(255,255,255,.4);z-index:5;touch-action:none;display:grid;place-items:center;user-select:none;-webkit-user-select:none}
#stick i{width:52px;height:52px;border-radius:50%;background:rgba(240,240,240,.8);box-shadow:0 2px 8px rgba(0,0,0,.45);pointer-events:none;transition:transform .08s}
body.inbattle #stick{visibility:hidden}
body.touch #hint{display:none}
/* phones play sideways: a card asks to turn the phone while it is upright */
#rotate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 40%,#1e2638,#0b0e14);color:#ece7da;text-align:center}
#rotate .rot-card{max-width:320px;display:flex;flex-direction:column;align-items:center;gap:14px}
#rotate h2{font-size:1.5em}
#rotate p{margin:0;color:#b8b2a2;line-height:1.5}
.rot-phone{width:58px;height:96px;border:4px solid #f0c860;border-radius:12px;position:relative;animation:rotphone 2.4s ease-in-out infinite}
.rot-phone::after{content:"";position:absolute;left:50%;bottom:6px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#f0c860}
@keyframes rotphone{0%,25%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.rot-phone{animation:none;transform:rotate(-90deg)}}
/* short landscape screens (phones turned sideways): one scrolling menu row, no hint, smaller HUD, buttons beside the hotbar */
@media (max-height:520px){
  #hint{display:none}
  #menu{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:0 8px calc(4px + env(safe-area-inset-bottom,0px));gap:4px;pointer-events:auto;scrollbar-width:none}
  #menu button{flex:none;padding:.28em .6em;font-size:.76em}
  #hud{padding-top:calc(4px + env(safe-area-inset-top,0px));gap:6px}
  #who{padding:4px 8px;gap:6px;flex-basis:200px;max-width:300px;font-size:.82em}
  #avatar{width:30px;height:30px;font-size:.9em}
  #quest{font-size:.68em;padding:4px 8px;flex-basis:170px}
  #minimap{width:84px;height:84px}
  #toasts{top:calc(96px + env(safe-area-inset-top,0px));max-width:min(260px,calc(100% - 32px))}
  #hotbar{left:max(8px,env(safe-area-inset-left,0px));transform:none;max-width:calc(100% - 190px)}
  #hotbar .hb{width:50px;height:44px}
  #jumpBtn{width:50px;height:50px}
  #atkBtn{width:60px;height:60px;right:calc(max(16px,env(safe-area-inset-right,0px)) + 58px)}
  #stick{width:104px;height:104px}#stick i{width:46px;height:46px}
  body.touch #hotbar{left:calc(max(18px,env(safe-area-inset-left,0px)) + 116px);max-width:calc(100% - 320px)}
}
</style>
